<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Raccoons Bin</title>
    <style>
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            color: #333;
        }

        
        .header-section {
            background-color: #1a1e24;
            color: #ffffff;
            text-align: center;
            padding: 40px 20px;
        }

        .logo-placeholder {
            font-size: 50px;
            margin-bottom: 10px;
        }

        .header-section h1 {
            margin: 5px 0;
            font-size: 2.2rem;
            font-weight: 400;
            letter-spacing: 1px;
        }

        .header-section p {
            color: #b0b5bc;
            font-size: 1rem;
            margin-top: 10px;
        }

        /* Container for the Content */
        .main-container {
            max-width: 600px;
            margin: 30px auto;
            background: #ffffff;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border-radius: 4px;
        }

        .menu-title {
            font-size: 1.8rem;
            font-weight: 300;
            margin-top: 0;
            margin-bottom: 25px;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
        }

        
        .menu-item {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
            font-size: 1.1rem;
        }

        .menu-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            margin-right: 15px;
            cursor: pointer;
        }

        
        .item-icon {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            background-color: #e0b034; 
            margin-right: 15px;
            display: inline-block;
            border: 2px solid #fff;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        
        .lettuce { background-color: #8cb83e; }
        .burger  { background-color: #d99136; }
        .chicken { background-color: #b54524; }
        .fries   { background-color: #e3c434; }
        .tofu    { background-color: #df7a28; }

        .item-label {
            cursor: pointer;
            flex-grow: 1;
        }

        
        .btn-order {
            background-color: #ffffff;
            color: #333;
            border: 1px solid #999;
            padding: 10px 20px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 15px;
        }

        .btn-order:hover {
            background-color: #f0f0f0;
            border-color: #666;
        }

        
        #show {
            margin-top: 25px;
            padding: 15px;
            background-color: #fafafa;
            border-left: 4px solid #1a1e24;
            color: #555;
            font-style: italic;
        }
        
        .footer-note {
            text-align: center;
            color: #999;
            font-size: 0.9rem;
            margin-top: 30px;
        }
    </style>
</head>
<body>

    
    <div class="header-section">
        <div class="logo-placeholder">🦝</div>
        <h1>Raccoons Bin</h1>
        <p>90626 racoons love this yeah frfr. Delicious food.</p>
    </div>

    <!-- Main Menu Area -->
    <div class="main-container">
        <div class="menu-title">◇ Menu</div>
        
        
        <div class="menu-item">
            <input type="checkbox" id="item1" value="120">
            <span class="item-icon lettuce"></span>
            <label for="item1" class="item-label">Beetles — ₱120</label>
        </div>

        <div class="menu-item">
            <input type="checkbox" id="item2" value="150">
            <span class="item-icon burger"></span>
            <label for="item2" class="item-label">Snails — ₱150</label>
        </div>

       
        <div class="menu-item">
            <input type="checkbox" id="item3" value="420">
            <span class="item-icon chicken"></span>
            <label for="item3" class="item-label">Chicken Bones — ₱420</label>
        </div>

        
        <div class="menu-item">
            <input type="checkbox" id="item4" value="350">
            <span class="item-icon fries"></span>
            <label for="item4" class="item-label">Meat trimmings — ₱350</label>
        </div>

        
        <div class="menu-item">
            <input type="checkbox" id="item5" value="550">
            <span class="item-icon tofu"></span>
            <label for="item5" class="item-label">Premium goldfish — ₱550</label>
        </div>

        
        <button class="btn-order" onclick="create_order()">Create Order !</button>
        
        
        <div id="show">Your order summary will appear here. 'v'</div>
        
    </div>

</body>
</html>
